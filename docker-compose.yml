# Local full-stack run: docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "8001:8001"
    depends_on:
      - mongo
volumes:
  mongo-data:
